<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Cliques</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; background-color: #f4f4f9; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background-color: #0078D4; color: white; border: none; border-radius: 5px; }
        button:hover { background-color: #005a9e; }
        #counter { font-size: 24px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Contador de Cliques na Nuvem</h1>
    <button onclick="clicar()">Clique Aqui!</button>
    <div id="counter">Carregando...</div>

    <script>
        // Substitua pela URL da sua Function quando publicar (ou http://localhost:7071/api/ClickCounter para testes)
        const apiUrl = 'http://localhost:7071/api/ClickCounter';

        async function carregarContador() {
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                document.getElementById('counter').innerText = `Total de cliques: ${data.count}`;
            } catch (error) {
                document.getElementById('counter').innerText = 'Erro ao carregar contador.';
            }
        }

        async function clicar() {
            try {
                const response = await fetch(apiUrl, { method: 'POST' });
                const data = await response.json();
                document.getElementById('counter').innerText = `Total de cliques: ${data.count}`;
            } catch (error) {
                alert('Erro ao registrar clique.');
            }
        }

        // Carrega o valor inicial ao abrir a página
        carregarContador();
    </script>
</body>
</html>
